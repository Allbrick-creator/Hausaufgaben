<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hausaufgaben</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aufgaben">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<style>
:root{--ink:#111;--muted:#6b6b70;--line:#e5e5ea;--bg:#fff;--soft:#f5f5f7;--danger:#c0281d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);overscroll-behavior:none}
body.lock{overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* Buttons */
.btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:active{opacity:.75}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.danger{background:#fff;color:var(--danger);border-color:var(--line)}
.btn[disabled]{opacity:.5}
.icon-btn{width:40px;height:40px;padding:0;font-size:22px;line-height:1;display:grid;place-items:center}

/* Kopfzeile */
.bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar h1{font-size:20px;font-weight:700;margin:0 auto 0 8px;letter-spacing:-.2px}
.bar .group{display:flex;gap:8px;align-items:center}

/* Wochenansicht */
.pager{flex:1;position:relative;overflow:hidden;min-height:0;touch-action:pan-y}
.pager *{touch-action:pan-y}
.view{position:absolute;inset:0;background:#fff;will-change:transform}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow-y:auto}
.day:first-child{border-left:0}
.day.today{background:var(--soft)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 6px 10px}
.dname{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:600;margin-top:2px}
.today .num{background:var(--ink);color:#fff}
.today .dname{color:var(--ink)}
.add{appearance:none;border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;width:28px;height:28px;cursor:pointer;border-radius:8px}
.add:active{background:var(--line)}
.dl{display:flex;flex-direction:column;gap:5px;padding:4px 6px 14px}

/* Aufgaben-Felder */
.chip{display:flex;align-items:flex-start;gap:7px;border-radius:7px;padding:7px 8px;font-size:14px;font-weight:600;line-height:1.25;cursor:pointer;word-break:break-word;user-select:none;-webkit-user-select:none}
.chip .ct{flex:1;min-width:0}
.chip.done{opacity:.4}
.chip.done .ct{text-decoration:line-through}
.check{position:relative;flex:none;width:18px;height:18px;border-radius:50%;border:2px solid currentColor;background:transparent;color:inherit;padding:0;margin-top:1px;font-size:11px;font-weight:800;line-height:1;display:grid;place-items:center;cursor:pointer}
.check::after{content:'';position:absolute;inset:-9px}
.urg{display:block;flex:none;width:16px;height:16px;margin-top:1px}
.urg svg{display:block}

/* Tagesansicht (iPhone) */
.dayview{overflow-y:auto;padding:14px 16px 24px}
.dayview .dl{padding:0;gap:8px}
.dayview .chip{font-size:16px;padding:12px 12px;border-radius:10px}
.dayview .check{width:22px;height:22px;font-size:13px}
.dayview .urg{width:20px;height:20px}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-size:15px}
.today-pill{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:2px 9px;margin-left:8px;vertical-align:middle}

/* Fenster zum Bearbeiten */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.sheet{background:#fff;width:100%;max-width:580px;max-height:92vh;max-height:92dvh;overflow-y:auto;border-radius:18px;padding:16px 18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet-title{font-size:20px;font-weight:700;letter-spacing:-.2px}
.m-title{width:100%;border:0;outline:0;font-family:inherit;font-size:24px;font-weight:700;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:12px;background:transparent;color:var(--ink)}
.m-desc{width:100%;min-height:150px;border:0;outline:0;resize:vertical;font-family:inherit;font-size:16px;line-height:1.45;background:var(--soft);border-radius:12px;padding:12px;margin-bottom:16px;color:var(--ink)}
.row{display:flex;gap:12px;margin-bottom:16px}
.row label{flex:1;font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.row input[type=date]{font-family:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:42px;width:100%}
.opt{display:flex;align-items:center;gap:10px;font-size:16px;padding:8px 0}
.opt input{width:22px;height:22px;accent-color:#111;margin:0}
.opt input:disabled{opacity:.5}
.opt small{color:var(--muted);font-size:13px}
.colors{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:6px 0 14px}
.colors .lbl{width:100%;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:-2px}
.sw{width:34px;height:34px;border-radius:50%;border:0;padding:0;cursor:pointer}
.sw.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px #111}
.colors input[type=color]{width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:50%;background:#fff;cursor:pointer}
.sheet-actions{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.exam-note{font-size:13px;color:var(--muted);padding:0 0 12px}

/* Einstellungen */
.set-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.set-item{appearance:none;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px;font-family:inherit;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer}
.set-item:active{background:var(--soft)}
.set-item small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:3px}
.set-item .arr{color:var(--muted);font-size:22px;font-weight:400;line-height:1}
.set-item.danger{color:var(--danger)}
.set-acc{font-size:13px;color:var(--muted);margin:18px 0 0;text-align:center;word-break:break-all}

/* Login */
.login{margin:auto;width:100%;max-width:360px;padding:24px;display:flex;flex-direction:column;gap:12px}
.login h1{font-size:28px;margin:0 0 8px;letter-spacing:-.4px}
.login input{font-family:inherit;font-size:16px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;color:var(--ink);background:#fff}
.login .err{color:var(--danger);font-size:14px;min-height:18px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;z-index:20;max-width:90vw}

/* Import aus Dateien */
.imp-help{font-size:15px;line-height:1.45;color:var(--muted);margin:0 0 14px}
.imp-pick{position:relative;display:inline-block;overflow:hidden}
.imp-pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0}
.imp-files{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.imp-file{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:10px;padding:8px 10px;font-size:15px}
.imp-file img{width:36px;height:36px;object-fit:cover;border-radius:6px;flex:none}
.imp-file .ico{width:36px;height:36px;border-radius:6px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);flex:none}
.imp-file .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-file button{appearance:none;border:0;background:transparent;font-size:22px;line-height:1;color:var(--muted);width:32px;height:32px;cursor:pointer;border-radius:8px}
.imp-sec{font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 6px}
.seg{display:flex;gap:8px;margin-bottom:4px}
.seg label{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.seg label small{font-weight:400;color:var(--muted);font-size:13px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.imp-note{width:100%;min-height:64px;resize:vertical;font-family:inherit;font-size:16px;line-height:1.4;background:var(--soft);border:0;border-radius:12px;padding:10px 12px;color:var(--ink);outline:0}
.imp-busy{text-align:center;padding:48px 0;font-size:16px;color:var(--muted)}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ink);margin:0 auto 16px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.imp-hint{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.4;margin:0 0 12px}
.prop{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.prop.off{opacity:.55}
.prop .ptop{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.prop .ptop input[type=checkbox]{width:24px;height:24px;accent-color:#111;margin:0;flex:none}
.prop .ptitle{flex:1;min-width:0;font-family:inherit;font-size:17px;font-weight:600;border:0;border-bottom:1px solid var(--line);padding:6px 0;outline:0;background:transparent;color:var(--ink)}
.prop .pdesc{width:100%;min-height:52px;resize:vertical;font-family:inherit;font-size:15px;line-height:1.4;background:var(--soft);border:0;border-radius:10px;padding:8px 10px;margin-bottom:10px;outline:0;color:var(--ink)}
.prop .row{margin-bottom:6px}
.prop .opts{display:flex;flex-wrap:wrap;gap:4px 18px}
.prop .opt{font-size:15px;padding:4px 0}
.prop .opt input{width:20px;height:20px}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:#fff1d6;color:#8a5a00;margin:0 0 8px}
.badge.dup{background:var(--soft);color:var(--muted)}
.prop.miss .row input[type=date]:first-child{border-color:#e0a000}

@media (max-width:700px){
  .overlay{padding:0;align-items:stretch}
  .sheet{max-width:none;max-height:none;height:100%;border-radius:0;padding-top:calc(14px + env(safe-area-inset-top))}
  .bar{padding:10px 12px}
  .bar h1{font-size:18px}
}
</style>
</head>
<body>
<div id="app"></div>

<div id="modal" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Aufgabe">
    <div class="sheet-top">
      <button class="btn ghost" id="m-close" type="button">Abbrechen</button>
      <button class="btn" id="m-save" type="button">Speichern</button>
    </div>
    <input id="m-title" class="m-title" placeholder="Titel" maxlength="120" autocomplete="off">
    <textarea id="m-desc" class="m-desc" placeholder="Beschreibung der Aufgabe …"></textarea>
    <div class="row">
      <label>Von<input type="date" id="m-start"></label>
      <label>Bis<input type="date" id="m-end"></label>
    </div>
    <label class="opt"><input type="checkbox" id="m-exam"> Prüfung <small>(immer rot, steht oben)</small></label>
    <label class="opt"><input type="checkbox" id="m-urgent"> Dringlich <small id="m-urgent-note">(mit Warnzeichen, steht weiter oben)</small></label>
    <div class="colors" id="m-colorrow">
      <div class="lbl">Farbe</div>
      <div id="m-swatches" style="display:contents"></div>
      <input type="color" id="m-custom" aria-label="Eigene Farbe wählen">
    </div>
    <label class="opt"><input type="checkbox" id="m-repeat"> Jede Woche wiederholen <small>(bis du die Aufgabe löschst)</small></label>
    <div class="sheet-actions">
      <button class="btn ghost" id="m-done" type="button" hidden></button>
      <button class="btn danger" id="m-delete" type="button" hidden>Aufgabe löschen</button>
    </div>
  </div>
</div>

<div id="imp" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Aus Datei importieren">
    <div class="sheet-top">
      <button class="btn ghost" id="imp-close" type="button">Abbrechen</button>
      <button class="btn" id="imp-go" type="button">Aufgaben erkennen</button>
    </div>
    <div id="imp-body"></div>
  </div>
</div>

<div id="settings" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Einstellungen">
    <div class="sheet-top">
      <div class="sheet-title">Einstellungen</div>
      <button class="btn" id="s-close" type="button">Fertig</button>
    </div>
    <div class="set-list">
      <button class="set-item" id="s-import" type="button"><span>Aus Datei importieren<small>Excel, Word oder Screenshots</small></span><span class="arr">›</span></button>
      <button class="set-item danger" id="s-logout" type="button"><span>Abmelden</span></button>
    </div>
    <div class="set-acc" id="s-acc"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://onmqftyswdatkxirmmpf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_4uFJH67QOjXem8uoEVr1Ig_ICxcpvU-';

// BEGIN HELPERS
const M = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const WD = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const WDS = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const EXAM = '#D92D20';
const PALETTE = ['#4F8EF7','#34C759','#FF9F0A','#AF52DE','#FF6B9D','#00B8D9','#8E8E93','#A2845E'];
const pad = n => String(n).padStart(2, '0');
const fmt = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
const todayStr = () => fmt(new Date());
const dayNum = s => { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); };
// Woche beginnt am Samstag und endet am Freitag
const weekStart = s => addDays(s, -((parse(s).getDay() + 1) % 7));
function occursOn(t, date) {
  if (!t.start_date || !t.end_date) return false;
  const s = dayNum(t.start_date), e = dayNum(t.end_date), d = dayNum(date);
  const len = e - s + 1;
  if (!t.repeat_weekly) return d >= s && d <= e;
  return d >= s && ((d - s) % 7) < Math.min(len, 7);
}
// Prüfungen sind immer dringlich
const isUrgent = t => !!(t.is_exam || t.is_urgent);
function safeColor(c) { return /^#[0-9a-fA-F]{6}$/.test(c) ? c : PALETTE[0]; }
function textOn(hex) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) > 170 ? '#111111' : '#ffffff';
}
// END HELPERS

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
let session = null, tasks = [], done = new Set(), cur = todayStr(), editing = null, currentColor = PALETTE[0], lastMobile = null;

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    if (k === 'class') e.className = props[k];
    else if (k === 'text') e.textContent = props[k];
    else if (k === 'style') e.style.cssText = props[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), props[k]);
    else e.setAttribute(k, props[k]);
  }
  kids.flat().forEach(c => { if (c != null) e.append(c); });
  return e;
}
function toast(msg) {
  const t = el('div', { class: 'toast', text: msg });
  document.body.append(t);
  setTimeout(() => t.remove(), 3500);
}
const isMobile = () => window.innerWidth < 700;

// Gezeichnetes Warndreieck: Dreieck in Textfarbe, «!» in Feldfarbe
function urgentIcon(bg, fg) {
  const s = el('span', { class: 'urg', role: 'img', 'aria-label': 'Dringlich' });
  s.innerHTML = '<svg viewBox="0 0 24 24" width="100%" height="100%" aria-hidden="true">' +
    '<path d="M12 2.6c.6 0 1.1.3 1.4.8l9.4 16.4c.6 1.1-.2 2.4-1.4 2.4H2.6c-1.2 0-2-1.3-1.4-2.4l9.4-16.4c.3-.5.8-.8 1.4-.8z" fill="' + fg + '"/>' +
    '<path d="M12 8.8v5.6" stroke="' + bg + '" stroke-width="2.5" stroke-linecap="round"/>' +
    '<circle cx="12" cy="18" r="1.5" fill="' + bg + '"/></svg>';
  return s;
}
const GEAR_SVG = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';

/* ---------- Daten ---------- */
async function loadData() {
  const [t, c] = await Promise.all([
    sb.from('tasks').select('*').order('created_at'),
    sb.from('task_completions').select('*')
  ]);
  if (t.error || c.error) { toast('Fehler beim Laden: ' + (t.error || c.error).message); return; }
  tasks = t.data;
  done = new Set(c.data.filter(r => !r.kind || r.kind === 'due').map(r => r.task_id + '|' + r.date));
  renderApp();
}
async function toggleDone(id, date) {
  const key = id + '|' + date;
  let error;
  if (done.has(key)) {
    done.delete(key); renderApp();
    ({ error } = await sb.from('task_completions').delete().eq('task_id', id).eq('date', date).eq('kind', 'due'));
  } else {
    done.add(key); renderApp();
    ({ error } = await sb.from('task_completions').insert({ task_id: id, date, kind: 'due' }));
  }
  if (error) { toast('Fehler: ' + error.message); loadData(); }
}
// Reihenfolge: Prüfungen, dann dringlich, dann der Rest
function tasksOn(date) {
  return tasks.filter(t => occursOn(t, date))
    .sort((a, b) => (b.is_exam - a.is_exam) || (isUrgent(b) - isUrgent(a)) || a.created_at.localeCompare(b.created_at));
}

/* ---------- Anzeige ---------- */
function chip(t, date) {
  const isDone = done.has(t.id + '|' + date);
  const color = t.is_exam ? EXAM : safeColor(t.color);
  const fg = textOn(color);
  return el('div', {
    class: 'chip' + (isDone ? ' done' : ''), role: 'button', tabindex: '0',
    style: 'background:' + color + ';color:' + fg,
    onclick: () => openModal(t, date)
  },
    el('button', { class: 'check', type: 'button', 'aria-label': 'Erledigt', text: isDone ? '✓' : '',
      onclick: ev => { ev.stopPropagation(); toggleDone(t.id, date); } }),
    el('span', { class: 'ct', text: t.title }),
    isUrgent(t) ? urgentIcon(color, fg) : null
  );
}
function newTaskDate() {
  if (isMobile()) return cur;
  const ws = weekStart(cur), td = todayStr();
  return (td >= ws && td <= addDays(ws, 6)) ? td : ws;
}
const EASE = 'cubic-bezier(.22,.61,.36,1)';
let animating = false, titleEl = null;

function titleFor(date) {
  if (isMobile()) {
    const d = parse(date);
    return WD[d.getDay()] + ', ' + d.getDate() + '. ' + M[d.getMonth()];
  }
  const a = parse(weekStart(date)), b = parse(addDays(weekStart(date), 6));
  return a.getDate() + '. ' + M[a.getMonth()] + ' – ' + b.getDate() + '. ' + M[b.getMonth()] + ' ' + b.getFullYear();
}
function updateTitle() { if (titleEl) titleEl.textContent = titleFor(cur); }
const samePage = (a, b) => isMobile() ? a === b : weekStart(a) === weekStart(b);

// Baut die Ansicht (Woche oder Tag) für ein Datum
function buildView(date) {
  const today = todayStr();
  if (isMobile()) {
    const list = tasksOn(date);
    const head = el('div', { style: 'font-size:15px;margin:0 0 12px;color:#6b6b70;font-weight:600' },

    return el('div', { class: 'dayview view' }, head,
      list.length ? el('div', { class: 'dl' }, list.map(t => chip(t, date))) : el('div', { class: 'empty', text: 'Keine Aufgaben an diesem Tag' }));
  }
  const ws = weekStart(date);

      el('div', { class: 'dl' }, tasksOn(day).map(t => chip(t, day)))));

  return week;
}

// Alte Ansicht gleitet hinaus, neue gleitet hinein
function slide(old, nv, dir, fromDx, W, duration) {
  animating = true;
  let finished = false;
  const a1 = old.animate([{ transform: 'translateX(' + fromDx + 'px)' }, { transform: 'translateX(' + (-dir * W) + 'px)' }],
    { duration, easing: EASE, fill: 'forwards' });
  const a2 = nv.animate([{ transform: 'translateX(' + (dir * W + fromDx) + 'px)' }, { transform: 'translateX(0px)' }],
    { duration, easing: EASE, fill: 'forwards' });
  const finish = () => {
    if (finished) return;
    finished = true;
    old.remove();
    nv.style.transform = '';
    try { a1.cancel(); a2.cancel(); } catch (e) {}
    animating = false;
  };
  a2.onfinish = finish;
  setTimeout(finish, duration + 120);
}
// Wischen abgebrochen: Ansicht springt zurück
function snapBack(old, nv, dir, dx, W) {
  animating = true;
  let finished = false;
  const a1 = old.animate([{ transform: 'translateX(' + dx + 'px)' }, { transform: 'translateX(0px)' }],
    { duration: 200, easing: EASE, fill: 'forwards' });
  const a2 = nv.animate([{ transform: 'translateX(' + (dir * W + dx) + 'px)' }, { transform: 'translateX(' + (dir * W) + 'px)' }],
    { duration: 200, easing: EASE, fill: 'forwards' });
  const finish = () => {
    if (finished) return;
    finished = true;
    nv.remove();
    old.style.transform = '';
    try { a1.cancel(); a2.cancel(); } catch (e) {}
    animating = false;
  };
  a2.onfinish = finish;
  setTimeout(finish, 320);
}
function navigateTo(target) {
  if (animating) return;
  const pager = $('.pager');
  const old = pager && pager.querySelector('.view');
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!old || reduce || samePage(cur, target)) { cur = target; renderApp(); return; }
  const dir = target > cur ? 1 : -1;
  const W = pager.offsetWidth;
  cur = target;
  updateTitle();
  const nv = buildView(cur);
  nv.style.transform = 'translateX(' + (dir * W) + 'px)';
  pager.append(nv);
  slide(old, nv, dir, 0, W, 300);
}
function go(dir) { navigateTo(addDays(cur, isMobile() ? dir : dir * 7)); }

// Wischen mit dem Finger: Ansicht folgt dem Finger
function attachSwipe(pager) {
  let sx = 0, sy = 0, lastX = 0, lastT = 0, vel = 0, mode = null, dir = 0, old = null, nv = null, W = 0;
  const reset = () => { mode = null; dir = 0; old = null; nv = null; };
  pager.addEventListener('touchstart', e => {
    reset();
    if (animating || e.touches.length !== 1) return;
    sx = lastX = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    lastT = e.timeStamp;
    vel = 0;
    old = pager.querySelector('.view');
    W = pager.offsetWidth;
  }, { passive: true });
  pager.addEventListener('touchmove', e => {
    if (!old) return;
    const x = e.touches[0].clientX, y = e.touches[0].clientY, dx = x - sx, dy = y - sy;
    if (mode === null) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      mode = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'h' : 'v';
    }
    if (mode !== 'h') return;
    const d = dx < 0 ? 1 : -1;
    if (d !== dir || !nv) {
      if (nv) nv.remove();
      dir = d;
      nv = buildView(addDays(cur, isMobile() ? dir : dir * 7));
      pager.append(nv);
    }
    old.style.transform = 'translateX(' + dx + 'px)';
    nv.style.transform = 'translateX(' + (dir * W + dx) + 'px)';
    const dt = e.timeStamp - lastT;
    if (dt > 0) vel = (x - lastX) / dt;
    lastX = x;
    lastT = e.timeStamp;
  }, { passive: true });
  const end = (e, cancelled) => {
    if (!old || mode !== 'h' || !nv) { reset(); return; }
    const dx = e.changedTouches[0].clientX - sx;
    const o = old, n = nv, d = dir;
    reset();
    const commit = !cancelled && (Math.abs(dx) > W * 0.25 ||
      (Math.abs(vel) > 0.5 && Math.abs(dx) > 20 && Math.sign(vel) === Math.sign(dx)));
    if (commit) {
      cur = addDays(cur, isMobile() ? d : d * 7);
      updateTitle();
      slide(o, n, d, dx, W, 240);
    } else {
      snapBack(o, n, d, dx, W);
    }
  };
  pager.addEventListener('touchend', e => end(e, false), { passive: true });
  pager.addEventListener('touchcancel', e => end(e, true), { passive: true });
}

function renderApp() {

/* ---------- Import aus Dateien ---------- */
// Excel und Word werden im Browser gelesen, Screenshots verkleinert. Der Inhalt geht an die
// Supabase-Funktion «import-tasks», die Claude fragt. Gespeichert wird erst nach deiner Kontrolle.
const IMP_FN = 'quick-processor';
const IMP_MAX_FILES = 8, IMP_MAX_IMAGES = 5, IMP_MAX_TEXT = 60000, IMP_MAX_BYTES = 15 * 1024 * 1024;
const LIB_URLS = {
  xlsx: 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
  mammoth: 'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js'
};
let impStage = 'pick', impFiles = [], impProps = [], impHint = '', impError = '', impNote = '';
let impModel = 'haiku', impColor = PALETTE[0], impRunId = 0, impReading = 0, impUid = 0;
const libLoads = {};

function loadLib(name) {
  if (!libLoads[name]) libLoads[name] = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = LIB_URLS[name];
    s.onload = res;
    s.onerror = () => { delete libLoads[name]; rej(new Error('Ein Hilfsprogramm konnte nicht geladen werden. Bitte Internet prüfen.')); };
    document.head.append(s);
  });
  return libLoads[name];
}
function htmlToText(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const clean = s => s.replace(/\s+/g, ' ').trim();
  const out = [];
  for (const n of doc.body.children) {
    if (n.tagName === 'TABLE') {
      n.querySelectorAll('tr').forEach(tr => {
        const line = [...tr.children].map(c => clean(c.textContent)).join(' | ');
        if (line.replace(/[|\s]/g, '')) out.push(line);
      });
    } else if (n.tagName === 'UL' || n.tagName === 'OL') {
      n.querySelectorAll('li').forEach(li => { const t = clean(li.textContent); if (t) out.push('- ' + t); });
    } else {
      const t = clean(n.textContent);
      if (t) out.push(t);
    }
  }
  return out.join('\n');
}
async function imageToJpeg(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error('Das Bild «' + file.name + '» konnte nicht gelesen werden.'));
      i.src = url;
    });
    const sc = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
    g.drawImage(img, 0, 0, w, h);
    const dataUrl = c.toDataURL('image/jpeg', 0.85);
    return { media_type: 'image/jpeg', data: dataUrl.split(',')[1], thumb: dataUrl };
  } finally { URL.revokeObjectURL(url); }
}
async function impReadFile(file) {
  const name = file.name || 'Bild';
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (file.size > IMP_MAX_BYTES) throw new Error('«' + name + '» ist zu gross (höchstens 15 MB).');
  const base = { id: ++impUid, name };
  if ((file.type || '').startsWith('image/') || ['png', 'jpg', 'jpeg', 'heic', 'heif', 'webp', 'gif'].includes(ext)) {
    return { ...base, kind: 'image', ...(await imageToJpeg(file)) };
  }
  let text = '', label = ext.toUpperCase();
  if (['xlsx', 'xlsm', 'xls'].includes(ext)) {
    await loadLib('xlsx');
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellNF: true });
    const parts = [];
    wb.SheetNames.forEach(sn => {
      const ws = wb.Sheets[sn];
      if (!ws || !ws['!ref']) return;
      const rng = XLSX.utils.decode_range(ws['!ref']);
      const lines = [];
      for (let r = rng.s.r; r <= Math.min(rng.e.r, rng.s.r + 3000); r++) {
        const cells = [];
        for (let c = rng.s.c; c <= Math.min(rng.e.c, rng.s.c + 60); c++) {
          const cell = ws[XLSX.utils.encode_cell({ r, c })];
          let v = '';
          if (cell) {
            if (cell.t === 'n' && cell.z && XLSX.SSF.is_date(cell.z)) {
              // Datum immer eindeutig als JJJJ-MM-TT weitergeben (nicht als 10/23/26)
              const d = XLSX.SSF.parse_date_code(cell.v);
              v = d.y + '-' + pad(d.m) + '-' + pad(d.d);
            } else {
              v = cell.w != null ? cell.w : (cell.v != null ? String(cell.v) : '');
            }
          }
          cells.push(String(v).replace(/\s+/g, ' ').trim());
        }
        const line = cells.join(' | ');
        if (line.replace(/[|\s]/g, '')) lines.push(line);
      }
      if (lines.length) parts.push('## Tabellenblatt «' + sn + '»\n' + lines.join('\n'));
    });
    text = parts.join('\n\n');
  } else if (ext === 'docx') {
    await loadLib('mammoth');
    const r = await mammoth.convertToHtml({ arrayBuffer: await file.arrayBuffer() });
    text = htmlToText(r.value);
  } else if (['txt', 'csv', 'md'].includes(ext)) {
    text = (await file.text()).trim();
  } else if (ext === 'doc') {
    throw new Error('«' + name + '» ist ein altes Word-Format (.doc). Bitte in Word als .docx speichern.');
  } else {
    throw new Error('«' + name + '»: Dieser Dateityp wird nicht unterstützt. Erlaubt sind Excel, Word (.docx), Bilder und Textdateien.');
  }
  if (!text.trim()) throw new Error('In «' + name + '» wurde kein Text gefunden.');
  return { ...base, kind: 'text', text, label };
}
async function impAddFiles(list) {
  impError = '';
  impReading++;
  impRender();
  for (const file of list) {
    try {
      if (impFiles.length >= IMP_MAX_FILES) throw new Error('Höchstens ' + IMP_MAX_FILES + ' Dateien auf einmal.');
      const f = await impReadFile(file);
      if (f.kind === 'image' && impFiles.filter(x => x.kind === 'image').length >= IMP_MAX_IMAGES) throw new Error('Höchstens ' + IMP_MAX_IMAGES + ' Bilder auf einmal.');
      impFiles.push(f);
    } catch (e) { impError = e.message; }
  }
  impReading--;
  impRender();
}
async function fnErrorText(error) {
  const r = error && error.context;
  if (r && typeof r.json === 'function') {
    if (r.status === 404) return 'Die Funktion «quick-processor» ist bei Supabase nicht erreichbar (nicht gefunden).';
    if (r.status === 401) {
      try { const j = await r.clone().json(); if (j && j.error) return j.error; } catch (e) {}
      return 'Die Anmeldung wurde abgelehnt (Code 401). Bitte neu anmelden. Hilft das nicht: In Supabase bei der Funktion «Verify JWT» ausschalten.';
    }
    try { const j = await r.json(); if (j && j.error) return j.error; } catch (e) {}
    return 'Fehler bei der Funktion (Code ' + r.status + ').';
  }
  return 'Keine Verbindung zur Funktion. Bitte Internet prüfen.';
}
const impDup = p => !!p.start_date && tasks.some(t => t.start_date === p.start_date && t.title.trim().toLowerCase() === p.title.trim().toLowerCase());

async function impRun() {
  if (!impFiles.length || impReading) return;
  const id = ++impRunId;
  impError = '';
  impStage = 'busy';
  impRender();
  let text = '', budget = IMP_MAX_TEXT, cut = false;
  for (const f of impFiles) if (f.kind === 'text') {
    if (budget <= 0) { cut = true; continue; }
    let t = f.text;
    if (t.length > budget) { t = t.slice(0, budget); cut = true; }
    budget -= t.length;
    text += '\n\n=== Datei: ' + f.name + ' ===\n' + t;
  }
  const images = impFiles.filter(f => f.kind === 'image').map(f => ({ media_type: f.media_type, data: f.data }));
  try {
    const { data, error } = await sb.functions.invoke(IMP_FN, { body: { model: impModel, today: todayStr(), text, images, note: impNote } });
    if (id !== impRunId) return;
    if (error) throw new Error(await fnErrorText(error));
    if (!data || data.error || !Array.isArray(data.tasks)) throw new Error((data && data.error) || 'Die Antwort war leer. Bitte noch einmal versuchen.');
    impProps = data.tasks.map(t => {
      const p = {
        title: String(t.title || ''), description: String(t.description || ''),
        start_date: t.start_date || null, end_date: t.end_date || t.start_date || null,
        is_exam: !!t.is_exam, is_urgent: !!t.is_urgent, repeat_weekly: !!t.repeat_weekly
      };
      p.miss = !p.start_date;
      p.dup = impDup(p);
      p.on = !p.miss && !p.dup;
      return p;
    });
    impHint = ((data.hinweis || '') + (cut ? ' Der Text war sehr lang, es wurde nur der Anfang gelesen.' : '')).trim();
    impStage = 'review';
  } catch (e) {
    if (id !== impRunId) return;
    impError = e.message || 'Unbekannter Fehler';
    impStage = 'pick';
  }
  impRender();
}

function impUpdateCount() {
  const n = impProps.filter(p => p.on).length;
  const b = $('#imp-go');
  b.textContent = n === 1 ? '1 Aufgabe speichern' : n + ' Aufgaben speichern';
  b.disabled = n === 0;
}
function propRow(p) {
  const row = el('div', { class: 'prop' + (p.on ? '' : ' off') + (p.miss && !p.start_date ? ' miss' : '') });
  const cb = el('input', { type: 'checkbox', 'aria-label': 'Aufgabe übernehmen' });
  cb.checked = p.on;
  cb.addEventListener('change', () => { p.on = cb.checked; row.classList.toggle('off', !p.on); impUpdateCount(); });
  const ti = el('input', { class: 'ptitle', maxlength: '120', 'aria-label': 'Titel', autocomplete: 'off' });
  ti.value = p.title;
  ti.addEventListener('input', () => { p.title = ti.value; });
  const de = el('textarea', { class: 'pdesc', placeholder: 'Beschreibung', 'aria-label': 'Beschreibung' });
  de.value = p.description;
  de.addEventListener('input', () => { p.description = de.value; });
  const s = el('input', { type: 'date' }), e = el('input', { type: 'date' });
  s.value = p.start_date || ''; e.value = p.end_date || '';
  s.addEventListener('change', () => {
    p.start_date = s.value || null;
    if (p.start_date && (!p.end_date || p.end_date < p.start_date)) { p.end_date = p.start_date; e.value = p.end_date; }
    row.classList.toggle('miss', !p.start_date);
    if (p.miss && p.start_date) { p.miss = false; p.on = true; cb.checked = true; row.classList.remove('off'); }
    if (p.start_date && missBadge) missBadge.remove();
    impUpdateCount();
  });
  e.addEventListener('change', () => { p.end_date = e.value || null; });
  const ur = el('input', { type: 'checkbox' });
  const syncUrgent = () => { ur.checked = p.is_exam || p.is_urgent; ur.disabled = p.is_exam; };
  ur.addEventListener('change', () => { p.is_urgent = ur.checked; });
  const ex = el('input', { type: 'checkbox' }); ex.checked = p.is_exam;
  ex.addEventListener('change', () => { p.is_exam = ex.checked; syncUrgent(); });
  syncUrgent();
  const rp = el('input', { type: 'checkbox' }); rp.checked = p.repeat_weekly;
  rp.addEventListener('change', () => { p.repeat_weekly = rp.checked; });
  const missBadge = p.miss && !p.start_date ? el('div', { class: 'badge', text: 'Datum fehlt – bitte wählen' }) : null;
  [
    el('div', { class: 'ptop' }, cb, ti),
    missBadge,
    p.dup ? el('div', { class: 'badge dup', text: 'Gibt es schon' }) : null,
    de,
    el('div', { class: 'row' }, el('label', null, 'Von', s), el('label', null, 'Bis', e)),
    el('div', { class: 'opts' },
      el('label', { class: 'opt' }, ex, 'Prüfung'),
      el('label', { class: 'opt' }, ur, 'Dringlich'),
      el('label', { class: 'opt' }, rp, 'Jede Woche'))
  ].forEach(n => { if (n) row.append(n); });
  return row;
}
function impRender() {
  const body = $('#imp-body'), go = $('#imp-go'), close = $('#imp-close');
  body.replaceChildren();
  close.textContent = impStage === 'review' ? 'Zurück' : 'Abbrechen';
  go.hidden = impStage === 'busy';
  if (impStage === 'busy') {
    body.append(el('div', { class: 'imp-busy' }, el('div', { class: 'spin' }), 'Die KI liest deine Dateien …', el('br'), el('small', { text: 'Das dauert meist 5 bis 20 Sekunden.' })));
    return;
  }
  if (impStage === 'review') {
    go.textContent = 'Speichern';
    if (impHint) body.append(el('div', { class: 'imp-hint', text: impHint }));
    if (!impProps.length) {
      body.append(el('div', { class: 'empty', text: 'Es wurden keine Aufgaben gefunden.' }));
      go.hidden = true;
      return;
    }
    body.append(el('div', { class: 'imp-sec', text: impProps.length === 1 ? '1 Vorschlag – bitte prüfen' : impProps.length + ' Vorschläge – bitte prüfen' }));
    const colors = el('div', { class: 'colors' }, el('div', { class: 'lbl', text: 'Farbe für alle (Prüfungen bleiben rot)' }));
    const setC = c => {
      impColor = safeColor(c);
      colors.querySelectorAll('.sw').forEach(b => b.classList.toggle('sel', b.dataset.c.toLowerCase() === impColor.toLowerCase()));
      custom.value = impColor;
    };
    const custom = el('input', { type: 'color', 'aria-label': 'Eigene Farbe wählen' });
    custom.addEventListener('input', () => setC(custom.value));
    PALETTE.forEach(c => colors.append(el('button', { class: 'sw', type: 'button', 'data-c': c, 'aria-label': 'Farbe ' + c, style: 'background:' + c, onclick: () => setC(c) })));
    colors.append(custom);
    setC(impColor);
    body.append(colors);
    impProps.forEach(p => body.append(propRow(p)));
    impUpdateCount();
    return;
  }
  // Auswahl der Dateien
  go.textContent = 'Aufgaben erkennen';
  go.disabled = !impFiles.length || impReading > 0;
  const input = el('input', { type: 'file', multiple: '', accept: '.xlsx,.xlsm,.xls,.docx,.txt,.csv,image/*', 'aria-label': 'Dateien wählen' });
  input.addEventListener('change', () => { const l = [...input.files]; input.value = ''; if (l.length) impAddFiles(l); });
  body.append(
    el('p', { class: 'imp-help', text: 'Wähle Excel-Tabellen, Word-Dokumente (.docx) oder Screenshots. Die KI sucht darin nach Aufgaben und Prüfungen. Du kontrollierst alles, bevor etwas gespeichert wird.' }),
    el('label', { class: 'btn ghost imp-pick' }, impReading ? 'Wird gelesen …' : 'Dateien wählen', input)
  );
  if (impError) body.append(el('div', { class: 'imp-hint', style: 'color:var(--danger);margin-top:12px', text: impError }));
  if (impFiles.length) {
    body.append(el('div', { class: 'imp-files' }, impFiles.map(f => el('div', { class: 'imp-file' },
      f.kind === 'image' ? el('img', { src: f.thumb, alt: '' }) : el('div', { class: 'ico', text: f.label }),
      el('span', { class: 'nm', text: f.name }),
      el('button', { type: 'button', 'aria-label': 'Entfernen', text: '×', onclick: () => { impFiles = impFiles.filter(x => x.id !== f.id); impRender(); } })))));
  }
  body.append(el('div', { class: 'imp-sec', text: 'Genauigkeit' }));
  const seg = el('div', { class: 'seg' });
  [['haiku', 'Schnell', 'Meist genug'], ['sonnet', 'Genauer', 'Für unklare Screenshots']].forEach(([v, t, sm]) => {
    const r = el('input', { type: 'radio', name: 'imp-model', value: v });
    r.checked = impModel === v;
    const lab = el('label', { class: impModel === v ? 'sel' : '' }, r, t, el('small', { text: sm }));
    r.addEventListener('change', () => { impModel = v; seg.querySelectorAll('label').forEach(l => l.classList.toggle('sel', l === lab)); });
    seg.append(lab);
  });
  body.append(seg);
  const note = el('textarea', { class: 'imp-note', placeholder: 'z. B. Fach: Mathe, Klasse 8b', 'aria-label': 'Hinweis' });
  note.value = impNote;
  note.addEventListener('input', () => { impNote = note.value; });
  body.append(el('div', { class: 'imp-sec', text: 'Hinweis für die KI (freiwillig)' }), note);
  if (!('ontouchstart' in window)) body.append(el('p', { class: 'imp-help', style: 'margin:14px 0 0;font-size:13px', text: 'Tipp: Screenshots kannst du hier auch direkt mit Cmd+V einfügen.' }));
}
function openImport() {
  impStage = 'pick'; impFiles = []; impProps = []; impHint = ''; impError = '';
  impRender();
  $('#imp').hidden = false;
  document.body.classList.add('lock');
  $('#imp .sheet').scrollTop = 0;
}
function closeImport(force) {
  if (!force && impStage === 'review' && impProps.some(p => p.on) && !confirm('Die Vorschläge wirklich verwerfen?')) return;
  impRunId++;
  impReading = 0;
  $('#imp').hidden = true;
  document.body.classList.remove('lock');
  impFiles = []; impProps = [];
}
async function impSave() {
  const sel = impProps.filter(p => p.on);
  if (!sel.length) { toast('Nichts ausgewählt'); return; }
  for (const p of sel) {
    if (!p.title.trim()) { toast('Eine Aufgabe hat keinen Titel'); return; }
    if (!p.start_date) { toast('Bitte bei «' + p.title.trim() + '» ein Datum wählen'); return; }
  }
  const rows = sel.map(p => ({
    title: p.title.trim().slice(0, 120), description: p.description || '', color: impColor,
    start_date: p.start_date, end_date: (p.end_date && p.end_date >= p.start_date) ? p.end_date : p.start_date,
    is_exam: !!p.is_exam, is_urgent: !!(p.is_exam || p.is_urgent), repeat_weekly: !!p.repeat_weekly
  }));
  const btn = $('#imp-go');
  btn.disabled = true;
  const { error } = await sb.from('tasks').insert(rows);
  btn.disabled = false;
  if (error) { toast('Fehler beim Speichern: ' + error.message); return; }
  const first = rows.map(r => r.start_date).sort()[0];
  closeImport(true);
  if (!rows.some(r => samePage(cur, r.start_date))) cur = first;
  toast(rows.length === 1 ? '1 Aufgabe gespeichert' : rows.length + ' Aufgaben gespeichert');
  loadData();
}

/* ---------- Start ---------- */
$('#s-close').addEventListener('click', closeSettings);
$('#s-import').addEventListener('click', () => { closeSettings(); openImport(); });
$('#s-logout').addEventListener('click', () => { closeSettings(); sb.auth.signOut(); });
$('#settings').addEventListener('click', ev => { if (ev.target.id === 'settings') closeSettings(); });
$('#imp-close').addEventListener('click', () => {
  if (impStage === 'review') { impStage = 'pick'; impRender(); } else closeImport();
});
$('#imp-go').addEventListener('click', () => { if (impStage === 'review') impSave(); else impRun(); });
document.addEventListener('paste', ev => {
  if ($('#imp').hidden || impStage !== 'pick') return;
  const files = [...((ev.clipboardData && ev.clipboardData.files) || [])].filter(f => f.type.startsWith('image/'));
  if (files.length) { ev.preventDefault(); impAddFiles(files); }
});
PALETTE.forEach(c => {
  $('#m-swatches').append(el('button', { class: 'sw', type: 'button', 'data-c': c, 'aria-label': 'Farbe ' + c, style: 'background:' + c, onclick: () => setColor(c) }));
});
$('#m-custom').addEventListener('input', ev => setColor(ev.target.value));
$('#m-exam').addEventListener('change', updateExamUI);
$('#m-close').addEventListener('click', closeModal);
$('#m-save').addEventListener('click', saveTask);
$('#m-delete').addEventListener('click', deleteTask);
$('#m-done').addEventListener('click', async () => {
  if (!editing || !editing.task) return;
  const { task, date } = editing;
  closeModal();
  toggleDone(task.id, date);
});
$('#modal').addEventListener('click', ev => { if (ev.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (!$('#modal').hidden) closeModal();
  else if (!$('#settings').hidden) closeSettings();
});
window.addEventListener('resize', () => { if (session && lastMobile !== isMobile()) renderApp(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && session && !editing) loadData(); });

sb.auth.onAuthStateChange((_event, s) => {
  const was = !!session;
  session = s;
  setTimeout(() => {
    if (s) { if (!was) loadData(); }
    else { tasks = []; done = new Set(); renderLogin(); }
  }, 0);
});
</script>
</body>
