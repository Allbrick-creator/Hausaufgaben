<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hausaufgaben</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aufgaben">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<style>
:root{--ink:#111;--muted:#6b6b70;--line:#e5e5ea;--bg:#fff;--soft:#f5f5f7;--danger:#c0281d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);overscroll-behavior:none}
body.lock{overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* Buttons */
.btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:active{opacity:.75}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.danger{background:#fff;color:var(--danger);border-color:var(--line)}
.btn[disabled]{opacity:.5}
.icon-btn{width:40px;height:40px;padding:0;font-size:22px;line-height:1;display:grid;place-items:center}

/* Kopfzeile */
.bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar h1{font-size:20px;font-weight:700;margin:0 auto 0 8px;letter-spacing:-.2px}
.bar .group{display:flex;gap:8px;align-items:center}

/* Wochenansicht */
.pager{flex:1;position:relative;overflow:hidden;min-height:0;touch-action:pan-y}
.pager *{touch-action:pan-y}
.view{position:absolute;inset:0;background:#fff;will-change:transform}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow-y:auto}
.day:first-child{border-left:0}
.day.today{background:var(--soft)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 6px 10px}
.dname{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:600;margin-top:2px}
.today .num{background:var(--ink);color:#fff}
.today .dname{color:var(--ink)}
.add{appearance:none;border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;width:28px;height:28px;cursor:pointer;border-radius:8px}
.add:active{background:var(--line)}
.dl{display:flex;flex-direction:column;gap:5px;padding:4px 6px 14px}

/* Aufgaben-Felder */
.chip{display:flex;align-items:flex-start;gap:7px;border-radius:7px;padding:7px 8px;font-size:14px;font-weight:600;line-height:1.25;cursor:pointer;word-break:break-word;user-select:none;-webkit-user-select:none}
.chip .ct{flex:1;min-width:0}
.chip.done{opacity:.4}
.chip.done .ct{text-decoration:line-through}
.check{position:relative;flex:none;width:18px;height:18px;border-radius:50%;border:2px solid currentColor;background:transparent;color:inherit;padding:0;margin-top:1px;font-size:11px;font-weight:800;line-height:1;display:grid;place-items:center;cursor:pointer}
.check::after{content:'';position:absolute;inset:-9px}

/* Tagesansicht (iPhone) */
.dayview{overflow-y:auto;padding:14px 16px 24px}
.dayview .dl{padding:0;gap:8px}
.dayview .chip{font-size:16px;padding:12px 12px;border-radius:10px}
.dayview .check{width:22px;height:22px;font-size:13px}
.empty{color:var(--muted);text-align:center;padding:40px 0;font-size:15px}
.today-pill{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:2px 9px;margin-left:8px;vertical-align:middle}

/* Fenster zum Bearbeiten */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.sheet{background:#fff;width:100%;max-width:580px;max-height:92vh;max-height:92dvh;overflow-y:auto;border-radius:18px;padding:16px 18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet-top{display:flex;justify-content:space-between;margin-bottom:10px}
.m-title{width:100%;border:0;outline:0;font-family:inherit;font-size:24px;font-weight:700;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:12px;background:transparent;color:var(--ink)}
.m-desc{width:100%;min-height:150px;border:0;outline:0;resize:vertical;font-family:inherit;font-size:16px;line-height:1.45;background:var(--soft);border-radius:12px;padding:12px;margin-bottom:16px;color:var(--ink)}
.row{display:flex;gap:12px;margin-bottom:16px}
.row label{flex:1;font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.row input[type=date]{font-family:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:42px;width:100%}
.opt{display:flex;align-items:center;gap:10px;font-size:16px;padding:8px 0}
.opt input{width:22px;height:22px;accent-color:#111;margin:0}
.opt small{color:var(--muted);font-size:13px}
.colors{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:6px 0 14px}
.colors .lbl{width:100%;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:-2px}
.sw{width:34px;height:34px;border-radius:50%;border:0;padding:0;cursor:pointer}
.sw.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px #111}
.colors input[type=color]{width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:50%;background:#fff;cursor:pointer}
.sheet-actions{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.exam-note{font-size:13px;color:var(--muted);padding:0 0 12px}

/* Login */
.login{margin:auto;width:100%;max-width:360px;padding:24px;display:flex;flex-direction:column;gap:12px}
.login h1{font-size:28px;margin:0 0 8px;letter-spacing:-.4px}
.login input{font-family:inherit;font-size:16px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;color:var(--ink);background:#fff}
.login .err{color:var(--danger);font-size:14px;min-height:18px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;z-index:20;max-width:90vw}

@media (max-width:700px){
  .overlay{padding:0;align-items:stretch}
  .sheet{max-width:none;max-height:none;height:100%;border-radius:0;padding-top:calc(14px + env(safe-area-inset-top))}
  .bar{padding:10px 12px}
  .bar h1{font-size:18px}
}
</style>
</head>
<body>
<div id="app"></div>

<div id="modal" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Aufgabe">
    <div class="sheet-top">
      <button class="btn ghost" id="m-close" type="button">Abbrechen</button>
      <button class="btn" id="m-save" type="button">Speichern</button>
    </div>
    <input id="m-title" class="m-title" placeholder="Titel" maxlength="120" autocomplete="off">
    <textarea id="m-desc" class="m-desc" placeholder="Beschreibung der Aufgabe …"></textarea>
    <div class="row">
      <label>Von<input type="date" id="m-start"></label>
      <label>Bis<input type="date" id="m-end"></label>
    </div>
    <label class="opt"><input type="checkbox" id="m-exam"> Prüfung <small>(immer rot, steht oben)</small></label>
    <div class="colors" id="m-colorrow">
      <div class="lbl">Farbe</div>
      <div id="m-swatches" style="display:contents"></div>
      <input type="color" id="m-custom" aria-label="Eigene Farbe wählen">
    </div>
    <label class="opt"><input type="checkbox" id="m-repeat"> Jede Woche wiederholen <small>(bis du die Aufgabe löschst)</small></label>
    <div class="sheet-actions">
      <button class="btn ghost" id="m-done" type="button" hidden></button>
      <button class="btn danger" id="m-delete" type="button" hidden>Aufgabe löschen</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://onmqftyswdatkxirmmpf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_4uFJH67QOjXem8uoEVr1Ig_ICxcpvU-';

// BEGIN HELPERS
const M = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const WD = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const WDS = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const EXAM = '#D92D20';
const PALETTE = ['#4F8EF7','#34C759','#FF9F0A','#AF52DE','#FF6B9D','#00B8D9','#8E8E93','#A2845E'];
const pad = n => String(n).padStart(2, '0');
const fmt = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
const todayStr = () => fmt(new Date());
const dayNum = s => { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); };
// Woche beginnt am Samstag und endet am Freitag
const weekStart = s => addDays(s, -((parse(s).getDay() + 1) % 7));
function occursOn(t, date) {
  const s = dayNum(t.start_date), e = dayNum(t.end_date), d = dayNum(date);
  const len = e - s + 1;
  if (!t.repeat_weekly) return d >= s && d <= e;
  return d >= s && ((d - s) % 7) < Math.min(len, 7);
}
function safeColor(c) { return /^#[0-9a-fA-F]{6}$/.test(c) ? c : PALETTE[0]; }
function textOn(hex) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) > 170 ? '#111111' : '#ffffff';
}
// END HELPERS

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
let session = null, tasks = [], done = new Set(), cur = todayStr(), editing = null, currentColor = PALETTE[0], lastMobile = null;

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    if (k === 'class') e.className = props[k];
    else if (k === 'text') e.textContent = props[k];
    else if (k === 'style') e.style.cssText = props[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), props[k]);
    else e.setAttribute(k, props[k]);
  }
  kids.flat().forEach(c => { if (c != null) e.append(c); });
  return e;
}
function toast(msg) {
  const t = el('div', { class: 'toast', text: msg });
  document.body.append(t);
  setTimeout(() => t.remove(), 3500);
}
const isMobile = () => window.innerWidth < 700;

/* ---------- Daten ---------- */
async function loadData() {
  const [t, c] = await Promise.all([
    sb.from('tasks').select('*').order('created_at'),
    sb.from('task_completions').select('*')
  ]);
  if (t.error || c.error) { toast('Fehler beim Laden: ' + (t.error || c.error).message); return; }
  tasks = t.data;
  done = new Set(c.data.map(r => r.task_id + '|' + r.date));
  renderApp();
}
async function toggleDone(id, date) {
  const key = id + '|' + date;
  let error;
  if (done.has(key)) {
    done.delete(key); renderApp();
    ({ error } = await sb.from('task_completions').delete().eq('task_id', id).eq('date', date));
  } else {
    done.add(key); renderApp();
    ({ error } = await sb.from('task_completions').insert({ task_id: id, date }));
  }
  if (error) { toast('Fehler: ' + error.message); loadData(); }
}
function tasksOn(date) {
  return tasks.filter(t => occursOn(t, date))
    .sort((a, b) => (b.is_exam - a.is_exam) || a.created_at.localeCompare(b.created_at));
}

/* ---------- Anzeige ---------- */
function chip(t, date) {
  const isDone = done.has(t.id + '|' + date);
  const color = t.is_exam ? EXAM : safeColor(t.color);
  return el('div', {
    class: 'chip' + (isDone ? ' done' : ''), role: 'button', tabindex: '0',
    style: 'background:' + color + ';color:' + textOn(color),
    onclick: () => openModal(t, date)
  },
    el('button', { class: 'check', type: 'button', 'aria-label': 'Erledigt', text: isDone ? '✓' : '',
      onclick: ev => { ev.stopPropagation(); toggleDone(t.id, date); } }),
    el('span', { class: 'ct', text: t.title })
  );
}
function newTaskDate() {
  if (isMobile()) return cur;
  const ws = weekStart(cur), td = todayStr();
  return (td >= ws && td <= addDays(ws, 6)) ? td : ws;
}
const EASE = 'cubic-bezier(.22,.61,.36,1)';
let animating = false, titleEl = null;

function titleFor(date) {
  if (isMobile()) {
    const d = parse(date);
    return WD[d.getDay()] + ', ' + d.getDate() + '. ' + M[d.getMonth()];
  }
  const a = parse(weekStart(date)), b = parse(addDays(weekStart(date), 6));
  return a.getDate() + '. ' + M[a.getMonth()] + ' – ' + b.getDate() + '. ' + M[b.getMonth()] + ' ' + b.getFullYear();
}
function updateTitle() { if (titleEl) titleEl.textContent = titleFor(cur); }
const samePage = (a, b) => isMobile() ? a === b : weekStart(a) === weekStart(b);

// Baut die Ansicht (Woche oder Tag) für ein Datum
function buildView(date) {
  const today = todayStr();
  if (isMobile()) {
    const list = tasksOn(date);
    const head = el('div', { style: 'font-size:15px;margin:0 0 12px;color:#6b6b70;font-weight:600' },
      document.createTextNode(date.split('-').reverse().join('.')));
    if (date === today) head.append(el('span', { class: 'today-pill', text: 'Heute' }));
    return el('div', { class: 'dayview view' }, head,
      list.length ? el('div', { class: 'dl' }, list.map(t => chip(t, date))) : el('div', { class: 'empty', text: 'Keine Aufgaben an diesem Tag' }));
  }
  const ws = weekStart(date);
  const week = el('div', { class: 'week view' });
  for (let i = 0; i < 7; i++) {
    const day = addDays(ws, i), d = parse(day);
    week.append(el('div', { class: 'day' + (day === today ? ' today' : '') },
      el('div', { class: 'dh' },
        el('div', { style: 'display:flex;flex-direction:column;gap:2px' },
          el('span', { class: 'dname', text: WDS[d.getDay()] }),
          el('span', { class: 'num', text: String(d.getDate()) })),
        el('button', { class: 'add', type: 'button', 'aria-label': 'Aufgabe hinzufügen', text: '+', onclick: () => openModal(null, day) })),
      el('div', { class: 'dl' }, tasksOn(day).map(t => chip(t, day)))));
  }
  return week;
}

// Alte Ansicht gleitet hinaus, neue gleitet hinein
function slide(old, nv, dir, fromDx, W, duration) {
  animating = true;
  let finished = false;
  const a1 = old.animate([{ transform: 'translateX(' + fromDx + 'px)' }, { transform: 'translateX(' + (-dir * W) + 'px)' }],
    { duration, easing: EASE, fill: 'forwards' });
  const a2 = nv.animate([{ transform: 'translateX(' + (dir * W + fromDx) + 'px)' }, { transform: 'translateX(0px)' }],
    { duration, easing: EASE, fill: 'forwards' });
  const finish = () => {
    if (finished) return;
    finished = true;
    old.remove();
    nv.style.transform = '';
    try { a1.cancel(); a2.cancel(); } catch (e) {}
    animating = false;
  };
  a2.onfinish = finish;
  setTimeout(finish, duration + 120);
}
// Wischen abgebrochen: Ansicht springt zurück
function snapBack(old, nv, dir, dx, W) {
  animating = true;
  let finished = false;
  const a1 = old.animate([{ transform: 'translateX(' + dx + 'px)' }, { transform: 'translateX(0px)' }],
    { duration: 200, easing: EASE, fill: 'forwards' });
  const a2 = nv.animate([{ transform: 'translateX(' + (dir * W + dx) + 'px)' }, { transform: 'translateX(' + (dir * W) + 'px)' }],
    { duration: 200, easing: EASE, fill: 'forwards' });
  const finish = () => {
    if (finished) return;
    finished = true;
    nv.remove();
    old.style.transform = '';
    try { a1.cancel(); a2.cancel(); } catch (e) {}
    animating = false;
  };
  a2.onfinish = finish;
  setTimeout(finish, 320);
}
function navigateTo(target) {
  if (animating) return;
  const pager = $('.pager');
  const old = pager && pager.querySelector('.view');
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!old || reduce || samePage(cur, target)) { cur = target; renderApp(); return; }
  const dir = target > cur ? 1 : -1;
  const W = pager.offsetWidth;
  cur = target;
  updateTitle();
  const nv = buildView(cur);
  nv.style.transform = 'translateX(' + (dir * W) + 'px)';
  pager.append(nv);
  slide(old, nv, dir, 0, W, 300);
}
function go(dir) { navigateTo(addDays(cur, isMobile() ? dir : dir * 7)); }

// Wischen mit dem Finger: Ansicht folgt dem Finger
function attachSwipe(pager) {
  let sx = 0, sy = 0, lastX = 0, lastT = 0, vel = 0, mode = null, dir = 0, old = null, nv = null, W = 0;
  const reset = () => { mode = null; dir = 0; old = null; nv = null; };
  pager.addEventListener('touchstart', e => {
    reset();
    if (animating || e.touches.length !== 1) return;
    sx = lastX = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    lastT = e.timeStamp;
    vel = 0;
    old = pager.querySelector('.view');
    W = pager.offsetWidth;
  }, { passive: true });
  pager.addEventListener('touchmove', e => {
    if (!old) return;
    const x = e.touches[0].clientX, y = e.touches[0].clientY, dx = x - sx, dy = y - sy;
    if (mode === null) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      mode = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'h' : 'v';
    }
    if (mode !== 'h') return;
    const d = dx < 0 ? 1 : -1;
    if (d !== dir || !nv) {
      if (nv) nv.remove();
      dir = d;
      nv = buildView(addDays(cur, isMobile() ? dir : dir * 7));
      pager.append(nv);
    }
    old.style.transform = 'translateX(' + dx + 'px)';
    nv.style.transform = 'translateX(' + (dir * W + dx) + 'px)';
    const dt = e.timeStamp - lastT;
    if (dt > 0) vel = (x - lastX) / dt;
    lastX = x;
    lastT = e.timeStamp;
  }, { passive: true });
  const end = (e, cancelled) => {
    if (!old || mode !== 'h' || !nv) { reset(); return; }
    const dx = e.changedTouches[0].clientX - sx;
    const o = old, n = nv, d = dir;
    reset();
    const commit = !cancelled && (Math.abs(dx) > W * 0.25 ||
      (Math.abs(vel) > 0.5 && Math.abs(dx) > 20 && Math.sign(vel) === Math.sign(dx)));
    if (commit) {
      cur = addDays(cur, isMobile() ? d : d * 7);
      updateTitle();
      slide(o, n, d, dx, W, 240);
    } else {
      snapBack(o, n, d, dx, W);
    }
  };
  pager.addEventListener('touchend', e => end(e, false), { passive: true });
  pager.addEventListener('touchcancel', e => end(e, true), { passive: true });
}

function renderApp() {
  animating = false;
  lastMobile = isMobile();
  const app = $('#app');
  app.replaceChildren();

  titleEl = el('h1', { text: titleFor(cur) });
  app.append(el('div', { class: 'bar' },
    el('div', { class: 'group' },
      el('button', { class: 'btn ghost icon-btn', type: 'button', 'aria-label': 'Zurück', text: '‹', onclick: () => go(-1) }),
      el('button', { class: 'btn ghost icon-btn', type: 'button', 'aria-label': 'Weiter', text: '›', onclick: () => go(1) })),
    titleEl,
    el('div', { class: 'group' },
      el('button', { class: 'btn ghost', type: 'button', text: 'Heute', onclick: () => navigateTo(todayStr()) }),
      el('button', { class: 'btn', type: 'button', text: '+ Neu', onclick: () => openModal(null, newTaskDate()) }),
      el('button', { class: 'btn ghost', type: 'button', text: 'Abmelden', onclick: () => sb.auth.signOut() }))
  ));

  const pager = el('div', { class: 'pager' }, buildView(cur));
  attachSwipe(pager);
  app.append(pager);
}

function renderLogin() {
  const app = $('#app');
  app.replaceChildren();
  const err = el('div', { class: 'err' });
  const email = el('input', { type: 'email', placeholder: 'E-Mail', autocomplete: 'username', required: '' });
  const pw = el('input', { type: 'password', placeholder: 'Passwort', autocomplete: 'current-password', required: '' });
  const btn = el('button', { class: 'btn', type: 'submit', text: 'Anmelden' });
  const form = el('form', { class: 'login' }, el('h1', { text: 'Hausaufgaben' }), email, pw, err, btn);
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    btn.disabled = true; err.textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email: email.value.trim(), password: pw.value });
    btn.disabled = false;
    if (error) err.textContent = 'Anmeldung fehlgeschlagen. Bitte E-Mail und Passwort prüfen.';
  });
  app.append(form);
}

/* ---------- Fenster zum Bearbeiten ---------- */
function setColor(c) {
  currentColor = safeColor(c);
  $('#m-custom').value = currentColor;
  document.querySelectorAll('#m-swatches .sw').forEach(b => b.classList.toggle('sel', b.dataset.c.toLowerCase() === currentColor.toLowerCase()));
}
function updateExamUI() { $('#m-colorrow').hidden = $('#m-exam').checked; }
function openModal(t, date) {
  editing = { task: t, date };
  $('#m-title').value = t ? t.title : '';
  $('#m-desc').value = t ? t.description : '';
  $('#m-start').value = t ? t.start_date : date;
  $('#m-end').value = t ? t.end_date : date;
  $('#m-exam').checked = t ? t.is_exam : false;
  $('#m-repeat').checked = t ? t.repeat_weekly : false;
  setColor(t ? t.color : PALETTE[0]);
  updateExamUI();
  $('#m-delete').hidden = !t;
  $('#m-done').hidden = !t;
  if (t) $('#m-done').textContent = done.has(t.id + '|' + date) ? 'Erledigt – zurücknehmen' : 'Als erledigt markieren';
  $('#modal').hidden = false;
  document.body.classList.add('lock');
  $('.sheet').scrollTop = 0;
  if (!t) setTimeout(() => $('#m-title').focus(), 60);
}
function closeModal() {
  $('#modal').hidden = true;
  document.body.classList.remove('lock');
  editing = null;
}
async function saveTask() {
  const title = $('#m-title').value.trim();
  if (!title) { toast('Bitte einen Titel eingeben'); return; }
  const s = $('#m-start').value;
  if (!s) { toast('Bitte ein Startdatum wählen'); return; }
  let e = $('#m-end').value || s;
  if (e < s) e = s;
  const payload = {
    title, description: $('#m-desc').value, color: currentColor,
    start_date: s, end_date: e,
    is_exam: $('#m-exam').checked, repeat_weekly: $('#m-repeat').checked
  };
  const btn = $('#m-save');
  btn.disabled = true;
  const q = editing.task ? sb.from('tasks').update(payload).eq('id', editing.task.id) : sb.from('tasks').insert(payload);
  const { error } = await q;
  btn.disabled = false;
  if (error) { toast('Fehler beim Speichern: ' + error.message); return; }
  closeModal();
  loadData();
}
async function deleteTask() {
  if (!editing || !editing.task) return;
  if (!confirm('Aufgabe wirklich löschen? Bei wiederkehrenden Aufgaben verschwinden alle Wochen.')) return;
  const { error } = await sb.from('tasks').delete().eq('id', editing.task.id);
  if (error) { toast('Fehler beim Löschen: ' + error.message); return; }
  closeModal();
  loadData();
}

/* ---------- Start ---------- */
PALETTE.forEach(c => {
  $('#m-swatches').append(el('button', { class: 'sw', type: 'button', 'data-c': c, 'aria-label': 'Farbe ' + c, style: 'background:' + c, onclick: () => setColor(c) }));
});
$('#m-custom').addEventListener('input', ev => setColor(ev.target.value));
$('#m-exam').addEventListener('change', updateExamUI);
$('#m-close').addEventListener('click', closeModal);
$('#m-save').addEventListener('click', saveTask);
$('#m-delete').addEventListener('click', deleteTask);
$('#m-done').addEventListener('click', async () => {
  if (!editing || !editing.task) return;
  const { task, date } = editing;
  closeModal();
  toggleDone(task.id, date);
});
$('#modal').addEventListener('click', ev => { if (ev.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#modal').hidden) closeModal(); });
window.addEventListener('resize', () => { if (session && lastMobile !== isMobile()) renderApp(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && session && !editing) loadData(); });

sb.auth.onAuthStateChange((_event, s) => {
  const was = !!session;
  session = s;
  setTimeout(() => {
    if (s) { if (!was) loadData(); }
    else { tasks = []; done = new Set(); renderLogin(); }
  }, 0);
});
</script>
</body>
</html>
